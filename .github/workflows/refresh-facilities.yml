# 주 1회 명부를 다시 받아 CSV 가 바뀌면 PR 을 연다.
#
# 자동으로 머지하지 않는다. 공공자료는 가끔 통째로 이상해지고, 그걸 잡아낼
# 수 있는 곳은 이 PR 의 diff 뿐이다. 폐업 판정은 여기서 하지 않는다 -
# 배포할 때 import-facilities.ts 가 하고, 거기에 별도 한계선이 있다.
name: 명부 갱신

on:
  schedule:
    # 매주 월요일 03:00 KST (UTC 18:00 일요일)
    - cron: "0 18 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: 공공 API 에서 받아 CSV 다시 쓰기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: npx tsx scripts/fetch-facilities.ts

      - name: 바뀐 곳 세기
        id: diff
        run: |
          if git diff --quiet -- src/assets/facilities; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            {
              echo "added=$(git diff --numstat -- src/assets/facilities | awk '{s+=$1} END {print s+0}')"
              echo "removed=$(git diff --numstat -- src/assets/facilities | awk '{s+=$2} END {print s+0}')"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: PR 열기
        if: steps.diff.outputs.changed == 'yes'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-facilities
          # 같은 브랜치에 계속 쌓지 않는다. 매주 그 주의 자료만 본다.
          delete-branch: true
          title: "chore(명부): 주간 갱신"
          commit-message: "chore(명부): 주간 갱신"
          body: |
            공공 API 에서 받은 주간 갱신이다. 자동으로 열렸다.

            CSV 줄 변화: +${{ steps.diff.outputs.added }} / -${{ steps.diff.outputs.removed }}

            **머지 전에 볼 것**
            - 줄 변화가 수십 줄을 넘으면 자료 사고를 의심해라. 개·폐업은 주 단위로 그렇게 많지 않다.
            - 사라진 줄이 많다면 머지하지 마라. 배포 때 `import-facilities.ts` 가 2% 한계에 걸려 폐업 판정을 건너뛰지만, 애초에 들이지 않는 편이 낫다.
            - 새로 생긴 안과는 진료시간(hours/lunch/recv/place)이 비어 있다. 상세정보 API 로 따로 채워야 한다.

            머지한 뒤 배포할 때 `npx tsx scripts/import-facilities.ts` 가 DB 에 반영한다.
