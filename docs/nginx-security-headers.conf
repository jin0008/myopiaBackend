# ─────────────────────────────────────────────────────────────────────────────
# Security response headers for myopiamanage.org (the WEB app / HTML served by
# nginx). Paste the `add_header` lines INSIDE the `server { ... }` block that
# serves the HTTPS site (listen 443), then: nginx -t && systemctl reload nginx
#
# These headers must live at the nginx layer because they protect the HTML
# document the browser renders — the Express backend only returns JSON.
# ─────────────────────────────────────────────────────────────────────────────

# Force HTTPS for 1 year (only enable once you are sure the site is always
# reachable over HTTPS — this is sticky in browsers and hard to undo quickly).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Clickjacking protection.
add_header X-Frame-Options "SAMEORIGIN" always;

# Stop MIME-type sniffing.
add_header X-Content-Type-Options "nosniff" always;

# Limit how much referrer info leaks to other sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disable browser features the app does not use.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;

# Hide the nginx version string (also set `server_tokens off;` in the http{} block).
server_tokens off;

# ─────────────────────────────────────────────────────────────────────────────
# Content-Security-Policy — the strongest anti-XSS control, but it CAN break the
# page (Google login script, styled-components/MUI inline styles, images, etc.).
# Roll it out safely:
#   1) First deploy it as *Report-Only* (below). It never blocks anything; it
#      only logs violations to the browser console. Click through the whole app
#      — login (Google), charts, community, image galleries — and note what the
#      console reports as blocked.
#   2) Add those sources to the policy, then switch the header name to the
#      enforcing `Content-Security-Policy`.
#
# Starting point (adjust the *-src lists to what the console shows you need):
# add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://myopiamanage.org; frame-src https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
